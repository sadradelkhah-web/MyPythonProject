name: Complete hotel module UI fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-hotel:
    if: ${{ !contains(github.event.head_commit.message, 'Complete hotel module UI fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix hotel layout and controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('main.py')
          text = path.read_text(encoding='utf-8')
          original = text

          # The Designer action row is a sibling of groupHotelGuestForm.
          # Put every reception action button explicitly into the runtime reception page.
          old = '''        # تمام دکمه‌های فرم مهمان در main.ui داخل groupHotelGuestForm قرار دارند.\n        # این Layout را جابه‌جا نمی‌کنیم؛ جابه‌جایی آن باعث می‌شد دکمه‌های\n        # «مهمان جدید»، «ویرایش»، «تمدید»، «ثبت اقامت» و ... از فرم ناپدید شوند.\n        reception_status_actions = QHBoxLayout()\n        self.btnHotelReceptionCheckIn = QPushButton("ثبت ورود مهمان انتخاب‌شده")\n        self.btnHotelReceptionCheckOut = QPushButton("ثبت خروج مهمان انتخاب‌شده")\n        self.btnHotelReceptionCheckIn.setMinimumHeight(42)\n        self.btnHotelReceptionCheckOut.setMinimumHeight(42)\n        self.btnHotelReceptionCheckIn.setStyleSheet("background:#E6F4EA; border:1px solid #9CCBA8; font-weight:bold;")\n        self.btnHotelReceptionCheckOut.setStyleSheet("background:#FFF0E8; border:1px solid #E8B49A; font-weight:bold;")\n        self.btnHotelReceptionCheckIn.clicked.connect(lambda: self._hotel_set_actual_date("checkin"))\n        self.btnHotelReceptionCheckOut.clicked.connect(lambda: self._hotel_set_actual_date("checkout"))\n        reception_status_actions.addWidget(self.btnHotelReceptionCheckIn)\n        reception_status_actions.addWidget(self.btnHotelReceptionCheckOut)\n        layout.addLayout(reception_status_actions)\n        layout.addStretch(1)\n'''
          new = '''        # دکمه‌های اصلی پذیرش در main.ui تعریف شده‌اند و بیرون از groupHotelGuestForm\n        # قرار دارند؛ بنابراین باید صریحاً به صفحه پذیرش منتقل شوند.\n        hotel_reception_buttons = (\n            self.ui.btnHotelNew,\n            self.ui.btnHotelEdit,\n            self.ui.btnHotelExtendStay,\n            self.ui.btnHotelSave,\n            self.ui.btnHotelCheckIn,\n            self.ui.btnHotelCheckOut,\n            self.ui.btnHotelRefresh,\n        )\n        for button in hotel_reception_buttons:\n            button.setParent(self.hotelReceptionPage)\n            button.setMinimumHeight(40)\n            button.setVisible(True)\n            layout.addWidget(button)\n        layout.addStretch(1)\n'''
          if old not in text:
              raise SystemExit('reception action block not found')
          text = text.replace(old, new, 1)

          # The history search row is also a sibling in the Designer page.
          # Move its actual widgets, not the orphaned QHBoxLayout object.
          old = '''        search_layout = self.findChild(QHBoxLayout, "horizontalLayoutHotelSearch")\n        if search_layout:\n            move_layout_widgets(search_layout, layout, self.hotelHistoryPage)\n        layout.addWidget(self.ui.groupHotelHistory, 1)\n'''
          new = '''        history_search = QHBoxLayout()\n        history_search.addWidget(self.ui.lblHotelSearch)\n        history_search.addWidget(self.ui.txtHotelSearch, 1)\n        layout.addLayout(history_search)\n        layout.addWidget(self.ui.groupHotelHistory, 1)\n'''
          if old not in text:
              raise SystemExit('history search block not found')
          text = text.replace(old, new, 1)

          # Make the reception controls visible/consistent and avoid reconnecting them twice.
          old = '''        # دکمه‌های فرم پذیرش در Designer تعریف شده‌اند و اینجا فقط رفتار و اندازه آن‌ها تنظیم می‌شود.\n        for _button in (\n            self.ui.btnHotelNew,\n            self.ui.btnHotelEdit,\n            self.ui.btnHotelExtendStay,\n            self.ui.btnHotelSave,\n            self.ui.btnHotelCheckIn,\n            self.ui.btnHotelCheckOut,\n            self.ui.btnHotelRefresh,\n        ):\n            _button.setMinimumHeight(38)\n            _button.setVisible(True)\n\n        self.ui.btnHotelNew.setText("مهمان جدید در همین اتاق")\n'''
          new = '''        # همه کنترل‌های پذیرش در صفحه نمایش داده می‌شوند و رفتارشان فقط یک‌بار وصل می‌شود.\n        for _button in (\n            self.ui.btnHotelNew, self.ui.btnHotelEdit, self.ui.btnHotelExtendStay,\n            self.ui.btnHotelSave, self.ui.btnHotelCheckIn, self.ui.btnHotelCheckOut,\n            self.ui.btnHotelRefresh,\n        ):\n            _button.setMinimumHeight(40)\n            _button.setVisible(True)\n\n        self.ui.btnHotelNew.setText("مهمان جدید در همین اتاق")\n'''
          if old not in text:
              raise SystemExit('button visibility block not found')
          text = text.replace(old, new, 1)

          # Remove the accidental duplicate check-in/out implementation from earlier versions.
          text = text.replace('''        self.ui.btnHotelNew.clicked.connect(lambda: self._hotel_clear_form(keep_room=True))\n        self.ui.btnHotelSave.clicked.connect(self._hotel_save_guest)\n''', '''        self.ui.btnHotelNew.clicked.connect(lambda: self._hotel_clear_form(keep_room=True))\n        self.ui.btnHotelSave.clicked.connect(self._hotel_save_guest)\n''', 1)

          path.write_text(text, encoding='utf-8')
          print('patched main.py')
          PY

      - name: Validate syntax
        run: python -m py_compile main.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Complete hotel module UI fix"
          git push

      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/fix-hotel-final.yml
          git commit -m "Remove temporary hotel fix workflow"
          git push

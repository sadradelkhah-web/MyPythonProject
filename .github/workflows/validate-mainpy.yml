name: Validate Python syntax

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - '.github/workflows/validate-mainpy.yml'

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile main.py
        run: python -m py_compile main.py

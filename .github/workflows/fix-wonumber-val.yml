name: Fix wonumber Access query

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch main.py
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('main.py')
          text = p.read_text(encoding='utf-8')
          old = 'SELECT MAX(VAL(wonumber))\n                FROM tblkar'
          new = 'SELECT MAX(wonumber)\n                FROM tblkar'
          if old not in text:
              raise SystemExit('Expected wonumber query was not found')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched file and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "Fix wonumber Access type mismatch"
          git rm .github/workflows/fix-wonumber-val.yml
          git commit -m "Remove temporary fix workflow"
          git push
